x-app-env: &app-env
  PYTHONPATH: /app/src
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL must be set}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_CLAIM_EMAIL: ${VAPID_CLAIM_EMAIL:-}
  TZ: Europe/Moscow

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &restart
  restart: always

services:
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Europe/Moscow
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - ./redis:/data
    logging: *logging
    <<: *restart
    networks:
      - task-manager

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/turtleold/task_manager}/backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      <<: *app-env
      PORT: ${PORT:-8000}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - shared-db
      - task-manager
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ./media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:$$PORT/api/health > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    <<: *restart

  dispatcher:
    image: ${IMAGE_REGISTRY:-ghcr.io/turtleold/task_manager}/backend:${IMAGE_TAG:-latest}
    command: ["sh", "-lc", "/app/.venv/bin/python /app/manage.py run_dispatcher"]
    env_file:
      - .env
    environment:
      <<: *app-env
      DISPATCHER_POLL_SECONDS: ${DISPATCHER_POLL_SECONDS:-20}
      DISPATCHER_MAINTENANCE_SECONDS: ${DISPATCHER_MAINTENANCE_SECONDS:-300}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shared-db
      - task-manager
    volumes:
      - ./media:/app/media
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          /app/.venv/bin/python /app/manage.py shell -c
          "import sys;from django.utils import timezone;from kanban.models import DispatcherHeartbeat;h=DispatcherHeartbeat.objects.filter(name='dispatcher').first();sys.exit(0 if h and h.last_tick_at and (timezone.now()-h.last_tick_at).total_seconds()<180 else 1)"
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 90s
    logging: *logging
    <<: *restart

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/turtleold/task_manager}/frontend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: /api
      VITE_PROXY_TARGET: http://backend:8000
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL must be set}
      TZ: Europe/Moscow
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging
    <<: *restart
    networks:
      - traefik-public
      - task-manager
    labels:
      taskmanager.skip: "true"
      traefik.enable: "true"
      traefik.http.routers.taskmanager.rule: "Host(`${PUBLIC_HOST:?PUBLIC_HOST must be set}`)"
      traefik.http.routers.taskmanager.entrypoints: "websecure"
      traefik.http.routers.taskmanager.tls.certresolver: "letsencrypt"
      traefik.http.services.taskmanager.loadbalancer.server.port: "5173"
      traefik.http.routers.taskmanager.middlewares: chain-public@file

networks:
  traefik-public:
    external: true
  shared-db:
    external: true
  task-manager:
    driver: bridge
